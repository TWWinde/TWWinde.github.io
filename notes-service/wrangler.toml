name = "twwinde-notebook"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Only this GitHub account can log in.
ALLOWED_LOGIN = "TWWinde"
# Private repo that stores the notes (Markdown files).
NOTES_REPO = "TWWinde/notes"
NOTES_BRANCH = "main"
# Where the notebook page lives; login redirects back here.
FRONTEND_URL = "https://twwinde.github.io/notes/"
# Extra origins allowed to call the API (comma separated), e.g. local Jekyll.
ALLOWED_ORIGINS = "http://localhost:4000,http://127.0.0.1:4000"
SESSION_DAYS = "30"
# Bump this number to log out every device at once.
SESSION_VERSION = "1"

# Secrets — set with `npx wrangler secret put <NAME>`, never commit them:
#   GITHUB_CLIENT_ID      OAuth App client ID
#   GITHUB_CLIENT_SECRET  OAuth App client secret
#   GITHUB_TOKEN          fine-grained PAT: only TWWinde/notes, Contents read & write
#   SESSION_SECRET        random string, at least 32 characters
